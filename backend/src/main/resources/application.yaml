logging:
  level:
    org.springframework.jdbc: info
    org.springframework.web: info
    com.example.clientragdemo: debug

server:
  tomcat:
    # When a request is refused for size, Tomcat keeps reading and discards up to this many bytes of
    # the rest of the body so the client receives the 413; past it the connection is closed and the
    # client sees a reset instead. Boot's 2MB default makes every oversized upload a reset. This is the
    # 105MB request limit plus headroom.
    max-swallow-size: 120MB

spring:
  application:
    name: rocky

  ai:
    openai:
      # No default - every environment needs an explicit SPRING_AI_OPENAI_BASE_URL (and
      # SPRING_AI_OPENAI_API_KEY, "" for a no-auth endpoint like Ollama's) pointed at whichever
      # OpenAI-compatible endpoint it actually has reachable: a local Ollama instance's /v1
      # routes for manual runs (see CLAUDE.md), Testcontainers' OllamaContainer for tests (see
      # TestcontainersConfiguration), or Tanzu Platform's genai-service marketplace proxy in
      # production (see manifest.yml).
      chat:
        # Deploy-time default - override via SPRING_AI_OPENAI_CHAT_MODEL for a real deployment's
        # actual model name. Not model-quality-critical: read-only Q&A grounded in retrieved
        # document content favors faithfulness over raw capability.
        model: qwen2.5:7b-instruct
      embedding:
        # Overridable via SPRING_AI_OPENAI_EMBEDDING_MODEL, but unlike the chat model this one
        # is NOT freely swappable later - its output dimension is baked into vector_store's
        # embedding vector(768) column at migration time (db/changelog/documents/db.changelog-documents-002.yaml).
        # Changing it means a schema migration plus a full reindex of every document.
        model: nomic-embed-text
    vectorstore:
      pgvector:
        # Liquibase owns the vector_store schema (db/changelog/documents/) - don't let
        # PgVectorStore create/alter it itself.
        initialize-schema: false
    chat:
      memory:
        repository:
          jdbc:
            # Liquibase owns the SPRING_AI_CHAT_MEMORY schema (db/changelog/chat/), referencing
            # this module's own bundled schema-postgresql.sql directly - don't let this
            # auto-initialize it too. (Default mode is EMBEDDED, which no-ops against a real
            # Postgres anyway, but being explicit matches the pgvector convention above.)
            initialize-schema: never

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      # spring-boot-docker-compose is a developmentOnly dependency, but merely being on the
      # classpath makes Spring Boot try to start Docker Compose unconditionally at startup - with
      # no compose file at the working directory's default discovery locations, that's a hard
      # startup failure (IllegalStateException: No Docker Compose file found), not a silent
      # no-op. Disabled by default; the local profile (application-local.yaml) re-enables it
      # pointed at the actual compose.yaml location.
      enabled: false

  servlet:
    multipart:
      # Boot's defaults (1MB/10MB) reject most real PDFs/DOCX outright. 100MB per file; the request
      # limit leaves 5MB for the other form fields and multipart framing. MaxUploadSizeExceededException
      # maps to 413 in GlobalExceptionHandler rather than the default 500.
      max-file-size: 100MB
      max-request-size: 105MB
      # Tomcat spills a part to the container's temp dir past this size rather than holding it in memory.
      file-size-threshold: 2MB
      # Parse the request when the handler asks for the part, so an oversized body fails inside the
      # handler and GlobalExceptionHandler answers it as a 413.
      resolve-lazily: true

management:
  endpoint:
    health:
      # Separate /actuator/health/liveness and /actuator/health/readiness groups, matching what
      # a Kubernetes-based platform (Tanzu) expects to probe.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Deliberately narrow - not "*". Health (for platform probes) and Prometheus (for scraping)
        # are permitAll in SecurityConfig; nothing else here is exposed or unauthenticated.
        include: health,prometheus

app:
  cors:
    # Comma-separated origins allowed to call the API with credentials (see SecurityConfig).
    # Defaults to the Vite dev server; override via APP_CORS_ALLOWED_ORIGINS for other environments.
    allowed-origins: http://localhost:5173
  documents:
    ingestion:
      # Max tokens per chunk (see DocumentIndexingAdapter's TokenTextSplitter). 800 matches
      # TokenTextSplitter's own built-in default - this just externalizes it. Lower via
      # APP_DOCUMENTS_INGESTION_CHUNK_SIZE when the embedding model's own context window is
      # smaller than this (e.g. manifest.yml sets 400 for Tanzu Platform's genai-service proxy,
      # which serves nomic-embed-text-v2-moe with just a 512-token limit - found only by a real
      # embedding call failing in production with chunks this size; kept well under 512 rather
      # than right up against it since TokenTextSplitter's own token count (jtokkit) and
      # whatever tokenizer that model actually enforces its limit with aren't guaranteed to
      # agree exactly on the same text).
      chunk-size: 800
  auth:
    # How users sign in (APP_AUTH_MODE): jdbc (default) - local username/password accounts in the users
    # table; oidc - single sign-on through an OpenID Connect provider, normally the Tanzu SSO tile's
    # service binding on Cloud Foundry, or plain settings anywhere else (see
    # OidcClientEnvironmentPostProcessor and offline/enable-sso.sh). Exactly one is
    # active. Any signed-in SSO user may use the app; there are no roles.
    mode: jdbc
    # jdbc only (APP_AUTH_REGISTRATION_ENABLED): whether anyone who can reach the app may create an account.
    # True by default because a jdbc deployment has no other way to create its first account; switch it off
    # once the accounts you need exist. oidc has no local registration at all.
    registration-enabled: true
    oidc:
      # Cloud Foundry: the bound p-identity service instance (APP_AUTH_OIDC_SERVICE) supplies the client id,
      # secret and issuer. Anywhere else (Kubernetes, ...) set APP_AUTH_OIDC_ISSUER_URI, APP_AUTH_OIDC_CLIENT_ID
      # and APP_AUTH_OIDC_CLIENT_SECRET - any OpenID Connect compliant provider works; they also override the
      # binding one by one. username-attribute is the claim that is the username (APP_AUTH_OIDC_USERNAME_ATTRIBUTE;
      # user_name is UAA's, preferred_username is common elsewhere). success-url is where the browser lands after
      # sign-in/out (default: the first app.cors.allowed-origins entry). Register
      # <backend>/login/oauth2/code/<registration-id> with the provider as the redirect URI.
      service: rocky-sso
      registration-id: sso
      username-attribute: user_name
  chat:
    # The chat model is small or slow (e.g. CPU-only models in an offline lab): APP_CHAT_LIMITED_MODEL=true cuts
    # every part of a chat that costs model time - 3 retrieved chunks (each labelled with its document id), answers
    # limited to 4 bullets / 100 words / one cited document id, 6 messages of history, 200 output tokens, and a title
    # taken from the first words of the message instead of a second model call. See ChatModeProperties.
    limited-model: false
    retrieval:
      # How many document chunks are retrieved and given to the chat model with each question
      # (QuestionAnswerAdvisor's topK; Spring AI's own default is 4). Chunks are small
      # (documents.ingestion.chunk-size, 128 tokens on Tanzu Platform), so 4 is only ~500 tokens of
      # source text. Raise it via APP_CHAT_RETRIEVAL_TOP_K, together with the chat model's context
      # window - the prompt is top-k x chunk-size + chat history (memory.max-messages) + the answer.
      top-k: 4
    memory:
      # How many messages MessageWindowChatMemory keeps per conversation before evicting the
      # oldest ones from the database outright (see ChatConfiguration#chatMemory - Spring AI
      # hardcodes this to 20 with no property of its own). 20 here just matches that default;
      # raise it via APP_CHAT_MEMORY_MAX_MESSAGES if long conversations losing early history
      # becomes a real problem.
      max-messages: 20
